hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  max_prompt_length: 1024
  max_response_length: 1024
  train_batch_size: 64
  return_raw_chat: True
  # Per-run convention: do NOT shuffle. Every run reads train.parquet in
  # parquet-row order, so step N processes the same prompts across runs.
  # `seed` left unset (no shuffle → no RNG needed).
  shuffle: False

actor_rollout_ref:
  hybrid_engine: True
  rollout:
    name: sglang
    multi_turn:
      enable: True
      max_assistant_turns: 2
      max_assistant_tokens: null
      format: qwen
